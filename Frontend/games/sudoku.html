<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Sudoku Game</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-top: 40px;
            background: #f4f6fb;
        }

        h1 {
            margin-bottom: 20px;
        }

        table {
            border-collapse: collapse;
        }

        td {
            border: 1px solid #999;
            width: 40px;
            height: 40px;
        }

        input {
            width: 100%;
            height: 100%;
            text-align: center;
            font-size: 18px;
            border: none;
            outline: none;
        }

        /* Thick borders for 3x3 grid */
        tr:nth-child(3n) td {
            border-bottom: 2px solid black;
        }

        td:nth-child(3n) {
            border-right: 2px solid black;
        }

        tr:first-child td {
            border-top: 2px solid black;
        }

        td:first-child {
            border-left: 2px solid black;
        }

        button {
            margin-top: 20px;
            padding: 10px 18px;
            font-size: 16px;
            cursor: pointer;
            border: none;
            background: #4f46e5;
            color: white;
            border-radius: 6px;
        }

        button:hover {
            background: #4338ca;
        }
    </style>
</head>
<body>

<h1>Sudoku</h1>

<table id="sudoku"></table>

<button onclick="solveSudoku()">Solve</button>

<script>
    const puzzle = [
        [5,3,0,0,7,0,0,0,0],
        [6,0,0,1,9,5,0,0,0],
        [0,9,8,0,0,0,0,6,0],
        [8,0,0,0,6,0,0,0,3],
        [4,0,0,8,0,3,0,0,1],
        [7,0,0,0,2,0,0,0,6],
        [0,6,0,0,0,0,2,8,0],
        [0,0,0,4,1,9,0,0,5],
        [0,0,0,0,8,0,0,7,9]
    ];

    const table = document.getElementById("sudoku");

    function createGrid() {
        for (let i = 0; i < 9; i++) {
            const row = document.createElement("tr");
            for (let j = 0; j < 9; j++) {
                const cell = document.createElement("td");
                const input = document.createElement("input");

                if (puzzle[i][j] !== 0) {
                    input.value = puzzle[i][j];
                    input.disabled = true;
                    input.style.background = "#e5e7eb";
                }

                cell.appendChild(input);
                row.appendChild(cell);
            }
            table.appendChild(row);
        }
    }

    function solveSudoku() {
        const board = [];

        for (let i = 0; i < 9; i++) {
            board[i] = [];
            for (let j = 0; j < 9; j++) {
                const value = table.rows[i].cells[j].firstChild.value;
                board[i][j] = value ? parseInt(value) : 0;
            }
        }

        if (solve(board)) {
            updateGrid(board);
        } else {
            alert("No solution exists!");
        }
    }

    function updateGrid(board) {
        for (let i = 0; i < 9; i++) {
            for (let j = 0; j < 9; j++) {
                table.rows[i].cells[j].firstChild.value = board[i][j];
            }
        }
    }

    function findEmpty(board) {
        for (let i = 0; i < 9; i++)
            for (let j = 0; j < 9; j++)
                if (board[i][j] === 0)
                    return [i, j];
        return null;
    }

    function isValid(board, num, row, col) {
        for (let x = 0; x < 9; x++) {
            if (board[row][x] === num || board[x][col] === num)
                return false;
        }

        const startRow = row - row % 3;
        const startCol = col - col % 3;

        for (let i = 0; i < 3; i++)
            for (let j = 0; j < 3; j++)
                if (board[startRow + i][startCol + j] === num)
                    return false;

        return true;
    }

    function solve(board) {
        const empty = findEmpty(board);
        if (!empty) return true;

        const [row, col] = empty;

        for (let num = 1; num <= 9; num++) {
            if (isValid(board, num, row, col)) {
                board[row][col] = num;
                if (solve(board)) return true;
                board[row][col] = 0;
            }
        }
        return false;
    }

    createGrid();
</script>

</body>
</html>
